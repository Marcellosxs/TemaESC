<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of Thrones Houses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Game of Thrones - Casele</h1>
        <button id="randomBtn">Schimbă Casa</button>
        <div class="table-container">
            <table id="houseTable">
                <thead>
                    <tr>
                        <th>Simbol / Coat of Arms</th>
                        <th>Nume</th>
                        <th>Regiune</th>
                        <th>Deviză</th>
                        <th>Titluri</th>
                        <th>Sediu</th>
                        <th>Lord Curent</th>
                        <th>Moștenitor</th>
                        <th>Suveran</th>
                        <th>Fondată</th>
                        <th>Fondator</th>
                        <th>Filiale</th>
                        <th>Membri Loiali</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Datele caselor vor fi populate de script.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Legătura către scriptul JS care va popula tabelul și va gestiona funcționalitățile -->
    <script src="script.js"></script>
</body>
</html>
